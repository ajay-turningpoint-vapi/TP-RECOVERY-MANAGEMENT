plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Real release signing (see android/keystore/tp-rms-release.jks) — loaded
// from a gitignored key.properties so the store/key passwords never land
// in version control. Falls back to the debug key when key.properties is
// missing (a fresh checkout without the keystore) so `flutter run
// --release` still works locally; `flutter build apk --release` for real
// distribution requires the real file.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.turningpoint.salesman_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.turningpoint.salesman_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // Two installable apps from one codebase: the real field app (Salesperson
    // / RE / Manager, entry point lib/main.dart) and a separate, admin-only
    // app (entry point lib/main_admin.dart — see android/app/src/admin's
    // manifest overlay for its distinct label). Different applicationId so
    // both can be installed side by side on the same device; the "field"
    // flavor keeps the original applicationId so the existing release
    // signing/keystore and any already-installed app are unaffected.
    // ("main" can't be used as a flavor name — it collides with Android's
    // reserved default src/main source set and fails the Gradle build.)
    // Build with:
    //   flutter build apk --release --flavor field -t lib/main.dart
    //   flutter build apk --release --flavor admin -t lib/main_admin.dart
    flavorDimensions = ["app"]
    productFlavors {
        field {
            dimension = "app"
        }
        admin {
            dimension = "app"
            applicationIdSuffix = ".admin"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Real upload key when key.properties/the keystore are present
            // (any real `flutter build apk --release`); the debug key only
            // as a fallback for `flutter run --release` on a checkout that
            // doesn't have the keystore.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            // Left off deliberately: AGP's resource shrinker silently
            // dropped res/xml/network_security_config.xml from a release
            // build despite it being referenced from
            // AndroidManifest.xml's android:networkSecurityConfig — every
            // HTTP request the app made then timed out with the manifest
            // still pointing at a now-missing resource. A tools:keep entry
            // (res/raw/keep.xml) didn't reliably fix it either, so code
            // shrinking (the bulk of the size/security win) stays on and
            // this narrower, riskier pass stays off.
            shrinkResources = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}
